name: Build and Push Todo API

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # self-hosted, pas ubuntu-latest : la cible de déploiement est arm64 (ce
    # Mac). Buildx sur ubuntu-latest émulait arm64 via QEMU pour produire
    # l'image, et QEMU plante sur "npm ci" (illegal instruction, JIT V8 mal
    # supporté en émulation) — build natif ici, pas d'émulation nécessaire.
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: gabrielmartin09/todo-api:${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted # au lieu de ubuntu-latest : ce job tourne chez vous

    steps:
      - uses: actions/checkout@v4

      - name: Load deploy key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust target host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Send compose.yml to target
        run: |
          scp -P "${{ secrets.DEPLOY_PORT }}" deploy/compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/compose.yml"

      - name: Deploy on target
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /srv/todo && TAG=${{ github.sha }} docker compose up -d"

      - name: Verify /health responds
        run: |
          for i in $(seq 1 10); do
            if curl -sf "http://${{ secrets.DEPLOY_HOST }}:3000/health"; then
              echo "API is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed"
          exit 1
