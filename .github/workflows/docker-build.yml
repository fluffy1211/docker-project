name: Build and Push Todo API

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

  db-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo_pw
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        # Actions attend que ce healthcheck passe avant de lancer les steps
        # du job : pas besoin d'attente active à la main pour laisser
        # Postgres finir son initialisation.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run DB integration tests
        run: npm run test:db
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: todo
          DB_PASSWORD: todo_pw
          DB_NAME: todo

  build:
    needs: [test, db-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # self-hosted, pas ubuntu-latest : la cible de déploiement est arm64 (ce
    # Mac). Buildx sur ubuntu-latest émulait arm64 via QEMU pour produire
    # l'image, et QEMU plante sur "npm ci" (illegal instruction, JIT V8 mal
    # supporté en émulation) — build natif ici, pas d'émulation nécessaire.
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: gabrielmartin09/todo-api:${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted # runner et todo-cluster vivent sur la même machine

    steps:
      - uses: actions/checkout@v4

      - name: Update todo-api image to this commit's sha
        run: |
          kubectl set image deployment/todo-api \
            todo-api=gabrielmartin09/todo-api:${{ github.sha }} \
            -n todo

      - name: Wait for rollout to converge
        run: |
          kubectl rollout status deployment/todo-api -n todo --timeout=120s
